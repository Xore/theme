name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish theme package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package theme
        run: |
          mkdir -p dist/xore-theme
          cp theme.css theme.js dist/xore-theme/
          cp theme.min.css theme.min.js dist/xore-theme/ 2>/dev/null || true
          # Every doc ships, not a hand-picked pair: ADOPTION.md and TOKENS.md
          # cross-reference COMPONENTS.md and CSP.md (#139), so bundling only
          # the first two published dangling links. New docs join the bundle
          # by existing in docs/, no workflow edit required.
          cp docs/*.md dist/xore-theme/
          (cd dist && zip -r "xore-theme-${GITHUB_REF_NAME}.zip" xore-theme)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes
