name: Screenshots

on:
  push:
    branches: [main]
    paths:
      - theme.css
      - theme.js
      - examples/**
      - scripts/**
      - .github/workflows/screenshots.yml
  pull_request:
    paths:
      - theme.css
      - theme.js
      - examples/**
      - scripts/**
      - .github/workflows/screenshots.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: "1.53.0"

jobs:
  capture:
    name: Capture example pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Playwright
        run: |
          npm install --global "playwright@${PLAYWRIGHT_VERSION}"
          playwright install --with-deps chromium

      - name: Capture screenshots
        run: scripts/capture-screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.sha }}
          path: docs/screenshots/
          retention-days: 30

      - name: Commit screenshots to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots docs/SCREENSHOTS.md
          if git diff --cached --quiet; then
            echo "No visual changes; nothing to commit."
          else
            git commit -m "docs: refresh example screenshots"
            git push
          fi
