name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Theme checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: node --check theme.js

      - name: Lint JavaScript
        run: npx --yes eslint@9 theme.js scripts/

      - name: Validate stylesheet structure
        run: node scripts/check-css.mjs theme.css

      - name: Generated theme block is current
        run: node scripts/gen-themes.mjs --check

      - name: WCAG AA contrast across every theme and mode
        run: node scripts/check-contrast.mjs

      - name: Validate example pages
        run: node scripts/check-examples.mjs

      - name: Spacing scale holds outside declared exemptions
        run: node scripts/check-space-scale.mjs theme.css
