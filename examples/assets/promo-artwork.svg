<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Abstract concentric arches in warm terracotta tones">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ead9"/>
      <stop offset="1" stop-color="#eadabd"/>
    </linearGradient>
    <filter id="grain2">
