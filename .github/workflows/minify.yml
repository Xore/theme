name: Minify

on:
  push:
    branches: [main]
    paths:
      - theme.css
      - theme.js
      - .github/workflows/minify.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minify-${{ github.ref }}
  cancel-in-progress: true

env:
  ESBUILD_VERSION: "0.25.9"

jobs:
  minify:
    name: Regenerate minified assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Minify theme.css and theme.js
        run: |
          npx --yes "esbuild@${ESBUILD_VERSION}" theme.css --minify --outfile=theme.min.css
          npx --yes "esbuild@${ESBUILD_VERSION}" theme.js --minify --outfile=theme.min.js

      - name: Commit minified assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add theme.min.css theme.min.js
          if git diff --cached --quiet; then
            echo "Minified assets already up to date."
          else
            git commit -m "chore: regenerate minified assets"
            git push
          fi
